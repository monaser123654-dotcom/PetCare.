<style id="aleef-responsive">
/* phone + tablet fixes */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.grid>*,.flex>*{min-width:0}
img,video,canvas,svg{max-width:100%}
pre{max-width:100%;overflow:auto}
button,a,[role=button],select,summary{touch-action:manipulation}
.btn{min-height:44px}
header.sticky{padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
main{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:767px){
  input,select,textarea{font-size:16px!important}
  textarea{max-height:8rem}
  h1{overflow-wrap:anywhere}
}
@media (max-width:480px){
  details .grid.grid-cols-2>div:not(.col-span-2),details .grid.grid-cols-2>label{grid-column:span 2}
}
@media (min-width:768px) and (max-width:1023px){
  /* tablets in portrait: keep scanner and chat in a comfortable single column */
  .card,section[aria-label]{max-width:44rem;margin-inline:auto;width:100%}
}
@media (hover:none) and (pointer:coarse){
  .btn,nav a,summary{min-height:44px}
  nav a{display:inline-flex;align-items:center}
}
@media (orientation:landscape) and (max-height:500px){
  header.sticky{position:static}
}

\u0645\u062A\u0643\u0631\u0631\u0629 \u062A\u062D\u0627\u0643\u064A \u0627\u0644\u0635\u064A\u062F\u060C \u0628\u064A\u0646\u0645\u0627 \u062A\u062D\u062A\u0627\u062C \u0645\u0639\u0638\u0645 \u0627\u0644\u0643\u0644\u0627\u0628 \u0625\u0644\u0649 \u0646\u0632\u0647\u0629 \u0623\u0648 \u0627\u062B\u0646\u062A\u064A\u0646 \u064A\u0648\u0645\u064A\u064B\u0627 \u0645\u0639 \u0648\u0642\u062A \u0644\u0644\u0634\u0645 \u0648\u0627\u0644\u0627\u0633\u062A\u0643\u0634\u0627\u0641. \u0627\u0644\u062D\u0631\u0643\u0629 \u062A\u062D\u0627\u0641\u0638 \u0639\u0644\u0649 \u0627\u0644\u0648\u0632\u0646 \u0627\u0644\u0645\u0646\u0627\u0633\u0628 \u0648\u062A\u062E\u0641\u0641 \u0627\u0644\u062A\u0648\u062A\u0631 \u0648\u062A\u0642\u0644\u0644 \u0627\u0644\u0633\u0644\u0648\u0643\u064A\u0627\u062A \u0627\u0644\u0645\u0632\u0639\u062C\u0629 \u062F\u0627\u062E\u0644 \u0627\u0644\u0645\u0646\u0632\u0644.","\u064A\u0642\u0636\u064A \u0627\u0644\u0642\u0637 \u0627\u0644\u0628\u0627\u0644\u063A \u0645\u0639\u0638\u0645 \u064A\u0648\u0645\u0647 \u0646\u0627\u0626\u0645\u064B\u0627\u060C \u0648\u062A\u062D\u062A\u0627\u062C \u0627\u0644\u0643\u0644\u0627\u0628 \u0623\u064A\u0636\u064B\u0627 \u0625\u0644\u0649 \u0633\u0627\u0639\u0627\u062A \u0637\u0648\u064A\u0644\u0629 \u0645\u0646 \u0627\u0644\u0631\u0627\u062D\u0629. \u0648\u0641\u0651\u0631 \u0644\u062D\u064A\u0648\u0627\u0646\u0643 \u0645\u0643\u0627\u0646\u064B\u0627 \u0647\u0627\u062F\u0626\u064B\u0627 \u0648\u062F\u0627\u0641\u0626\u064B\u0627 \u0628\u0639\u064A\u062F\u064B\u0627 \u0639\u0646 \u0627\u0644\u0636\u062C\u064A\u062C \u0648\u062D\u0631\u0643\u0629 \u0627\u0644\u0645\u0646\u0632\u0644\u060C \u0648\u062B\u0628\u0651\u062A \u0645\u0648\u0627\u0639\u064A\u062F \u0627\u0644\u0623\u0643\u0644 \u0648\u0627\u0644\u0646\u0648\u0645 \u0642\u062F\u0631 \u0627\u0644\u0625\u0645\u0643\u0627\u0646 \u0644\u0623\u0646 \u0627\u0644\u0631\u0648\u062A\u064A\u0646 \u064A\u0645\u0646\u062D\u0647 \u0634\u0639\u0648\u0631\u064B\u0627 \u0628\u0627\u0644\u0623\u0645\u0627\u0646.","\u0627\u0633\u0623\u0644 \u0623\u0647\u0644 \u0627\u0644\u062E\u0628\u0631\u0629 \u0639\u0646\u062F\u0645\u0627 \u062A\u0644\u0627\u062D\u0638 \u062A\u063A\u064A\u0631\u064B\u0627 \u064A\u0633\u062A\u0645\u0631 \u0623\u0643\u062B\u0631 \u0645\u0646 \u064A\u0648\u0645 \u0623\u0648 \u064A\u0648\u0645\u064A\u0646\u060C \u0645\u062B\u0644 \u0642\u0644\u0629 \u0627\u0644\u0623\u0643\u0644 \u0623\u0648 \u0627\u0644\u062E\u0645\u0648\u0644 \u0623\u0648 \u0643\u062B\u0631\u0629 \u0627\u0644\u062D\u0643. \u0648\u062A\u062F\u0648\u064A\u0646 \u0627\u0644\u0645\u0644\u0627\u062D\u0638\u0627\u062A \u0641\u064A \u062F\u0641\u062A\u0631 \u0635\u063A\u064A\u0631 \u0623\u0648 \u0641\u064A \u0647\u0627\u062A\u0641\u0643 \u064A\u062C\u0639\u0644 \u0627\u0644\u062D\u062F\u064A\u062B \u0639\u0646 \u0627\u0644\u062D\u0627\u0644\u0629 \u0623\u0648\u0636\u062D \u0648\u0623\u0633\u0631\u0639."],en:["Start the day with a quick look at your pet: energy, appetite, the way they walk, and the shine of their eyes and coat. These small notes become a baseline over time and help you spot changes early, because every animal has its own habits and temperament.","Cats need short, frequent play sessions that imitate hunting, while most dogs need one or two walks a day with time to sniff and explore. Movement keeps weight in check, eases stress and reduces unwanted behaviour at home.","An adult cat sleeps most of the day, and dogs also need long stretches of rest. Give your pet a quiet, warm spot away from noise and household traffic, and keep meal and sleep times steady where you can, since routine brings a sense of safety.","Ask for advice when a change lasts more than a day or two, such as eating less, low energy or a lot of scratching. Keeping notes in a small notebook or on your phone makes the story clearer and faster to share."]},"skin-coat-basics":{ar:["\u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0627\u0644\u0633\u0644\u064A\u0645 \u0646\u0634\u064A\u0637 \u0648\u0645\u0631\u062D\u060C \u0648\u0634\u0647\u064A\u062A\u0647 \u0645\u0646\u062A\u0638\u0645\u0629\u060C \u0648\u0639\u064A\u0646\u0627\u0647 \u0635\u0627\u0641\u064A\u062A\u0627\u0646 \u0648\u0623\u0646\u0641\u0647 \u0646\u0638\u064A\u0641\u060C \u0648\u0641\u0631\u0627\u0624\u0647 \u0644\u0627\u0645\u0639\u060C \u0648\u0648\u0632\u0646\u0647 \u062B\u0627\u0628\u062A \u0648\u0628\u0631\u0627\u0632\u0647 \u0637\u0628\u064A\u0639\u064A. \u062A\u0639\u0631\u0651\u0641 \u0639\u0644\u0649 \u0633\u0644\u0648\u0643 \u062D\u064A\u0648\u0627\u0646\u0643 \u0648\u0647\u0648 \u0628\u0635\u062D\u0629 \u062C\u064A\u062F\u0629 \u0644\u062A\u0644\u0627\u062D\u0638 \u0627\u0644\u0641\u0631\u0642 \u0639\u0646\u062F \u062D\u062F\u0648\u062B \u0623\u064A \u062A\u063A\u064A\u0651\u0631.","\u0627\u0644\u0639\u0646\u0627\u064A\u0629 \u0627\u0644\u062F\u0648\u0631\u064A\u0629 \u062A\u0634\u0645\u0644 \u0627\u0644\u062A\u0645\u0634\u064A\u0637 \u0627\u0644\u0645\u0646\u062A\u0638\u0645\u060C \u0648\u062A\u0646\u0638\u064A\u0641 \u0627\u0644\u0623\u0630\u0646\u064A\u0646 \u0648\u0627\u0644\u0623\u0633\u0646\u0627\u0646\u060C \u0648\u0642\u0635 \u0627\u0644\u0645\u062E\u0627\u0644\u0628 \u0639\u0646\u062F \u0627\u0644\u062D\u0627\u062C\u0629\u060C \u0648\u062A\u0648\u0641\u064A\u0631 \u0645\u0627\u0621 \u0646\u0638\u064A\u0641 \u0648\u063A\u0630\u0627\u0621 \u0645\u062A\u0648\u0627\u0632\u0646 \u0648\u0642\u062F\u0631 \u0643\u0627\u0641\u064D \u0645\u0646 \u0627\u0644\u062D\u0631\u0643\u0629. \u0648\u064A\u064F\u0646\u0635\u062D \u0628\u0641\u062D\u0635 \u0628\u064A\u0637\u0631\u064A \u0634\u0627\u0645\u0644 \u0645\u0631\u0629 \u0641\u064A \u0627\u0644\u0633\u0646\u0629 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644.","\u0645\u0646 \u0627\u0644\u0639\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u0633\u062A\u062D\u0642 \u0627\u0644\u0627\u0646\u062A\u0628\u0627\u0647: \u0642\u0644\u0629 \u0627\u0644\u0623\u0643\u0644 \u0623\u0648 \u0627\u0644\u0639\u0637\u0634 \u0627\u0644\u0634\u062F\u064A\u062F\u060C \u0648\u0627\u0644\u062E\u0645\u0648\u0644\u060C \u0648\u0627\u0644\u0642\u064A\u0621 \u0623\u0648 \u0627\u0644\u0625\u0633\u0647\u0627\u0644 \u0627\u0644\u0645\u062A\u0643\u0631\u0631\u060C \u0648\u0635\u0639\u0648\u0628\u0629 \u0627\u0644\u062A\u0646\u0641\u0633 \u0623\u0648 \u0627\u0644\u0633\u0639\u0627\u0644\u060C \u0648\u062A\u063A\u064A\u0651\u0631 \u0648\u0632\u0646 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0623\u0648 \u0633\u0644\u0648\u0643\u0647\u060C \u0648\u0631\u0627\u0626\u062D\u0629 \u063A\u064A\u0631 \u0645\u0639\u062A\u0627\u062F\u0629. \u0638\u0647\u0648\u0631 \u0623\u0643\u062B\u0631 \u0645\u0646 \u0639\u0644\u0627\u0645\u0629 \u0645\u0639\u064B\u0627 \u064A\u0633\u062A\u062F\u0639\u064A \u0627\u0644\u0627\u0646\u062A\u0628\u0627\u0647 \u0623\u0643\u062B\u0631 \u0645\u0646 \u0639\u0644\u0627\u0645\u0629 \u0648\u0627\u062D\u062F\u0629 \u0639\u0627\u0628\u0631\u0629.","\u0627\u0644\u0648\u0642\u0627\u064A\u0629 \u062A\u0642\u0648\u0645 \u0639\u0644\u0649 \u0623\u0633\u0627\u0633 \u0628\u0633\u064A\u0637: \u0627\u0644\u062A\u0637\u0639\u064A\u0645\u0627\u062A \u0641\u064A \u0645\u0648\u0627\u0639\u064A\u062F\u0647\u0627\u060C \u0648\u0645\u0636\u0627\u062F\u0627\u062A \u0627\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A \u0627\u0644\u0645\u0646\u0627\u0633\u0628\u0629 \u0644\u0646\u0648\u0639 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0648\u0648\u0632\u0646\u0647\u060C \u0648\u063A\u0630\u0627\u0621 \u0645\u062A\u0648\u0627\u0632\u0646\u060C \u0648\u0646\u0638\u0627\u0641\u0629 \u0628\u064A\u0626\u062A\u0647\u060C \u0648\u0641\u062D\u0635 \u062F\u0648\u0631\u064A \u0639\u0646\u062F \u0627\u0644\u0637\u0628\u064A\u0628 \u0627\u0644\u0628\u064A\u0637\u0631\u064A."],en:["A healthy pet is active and curious, eats regularly, has bright eyes, a clean nose, a glossy coat, a steady weight and normal stools. Learn how your pet behaves when all is well so you can notice any change.","Regular care includes brushing, cleaning the ears and teeth, trimming nails when needed, fresh water, a balanced diet and enough exercise. Plan a full veterinary check-up at least once a year.","Signs worth noticing include eating less or drinking much more, low energy, repeated vomiting or diarrhoea, trouble breathing or coughing, changes in weight or behaviour, and an unusual smell. Several signs together deserve more attention than a single passing one.","Prevention rests on simple foundations: vaccines on schedule, parasite control suited to the species and weight, a balanced diet, a clean environment and regular check-ups with your veterinarian."]},"skin-checks-at-home":{ar:["\u0627\u062E\u062A\u0631 \u0648\u0642\u062A\u064B\u0627 \u0647\u0627\u062F\u0626\u064B\u0627 \u0648\u0636\u0648\u0621\u064B\u0627 \u062C\u064A\u062F\u064B\u0627\u060C \u0648\u0627\u0645\u0633\u062D \u0628\u064A\u062F\u0643 \u0639\u0644\u0649 \u062C\u0633\u0645 \u062D\u064A\u0648\u0627\u0646\u0643 \u0645\u0646 \u0627\u0644\u0631\u0623\u0633 \u0625\u0644\u0649 \u0627\u0644\u0630\u064A\u0644. \u062A\u0641\u0642\u0651\u062F \u0627\u0644\u0639\u064A\u0646\u064A\u0646 \u0648\u0627\u0644\u0623\u0630\u0646\u064A\u0646 \u0648\u0627\u0644\u0641\u0645 \u0648\u0627\u0644\u0623\u0633\u0646\u0627\u0646 \u0648\u0627\u0644\u0628\u0637\u0646 \u0648\u0627\u0644\u0645\u062E\u0627\u0644\u0628 \u0648\u0645\u0627 \u062D\u0648\u0644 \u0627\u0644\u0630\u064A\u0644\u060C \u0641\u0647\u064A \u0623\u0645\u0627\u0643\u0646 \u062A\u062A\u062E\u0641\u0649 \u0641\u064A\u0647\u0627 \u0627\u0644\u0645\u0634\u0643\u0644\u0627\u062A.","\u0627\u0628\u062D\u062B \u0639\u0646 \u0623\u064A \u062A\u0648\u0631\u0651\u0645 \u0623\u0648 \u0643\u062A\u0644\u0629 \u062C\u062F\u064A\u062F\u0629\u060C \u0623\u0648 \u0625\u0641\u0631\u0627\u0632\u0627\u062A \u0645\u0646 \u0627\u0644\u0639\u064A\u0646\u064A\u0646 \u0623\u0648 \u0627\u0644\u0623\u0646\u0641 \u0623\u0648 \u0627\u0644\u0623\u0630\u0646\u064A\u0646\u060C \u0623\u0648 \u0631\u0627\u0626\u062D\u0629 \u063A\u064A\u0631 \u0645\u0639\u062A\u0627\u062F\u0629 \u0645\u0646 \u0627\u0644\u0641\u0645 \u0623\u0648 \u0627\u0644\u0623\u0630\u0646\u060C \u0623\u0648 \u0623\u0644\u0645 \u0639\u0646\u062F \u0627\u0644\u0644\u0645\u0633. \u0648\u0631\u0627\u0642\u0628 \u0633\u0644\u0648\u0643 \u062D\u064A\u0648\u0627\u0646\u0643 \u0623\u062B\u0646\u0627\u0621 \u0627\u0644\u0641\u062D\u0635: \u0625\u0646 \u0627\u0646\u0633\u062D\u0628 \u0623\u0648 \u0623\u0635\u062F\u0631 \u0635\u0648\u062A\u064B\u0627 \u0639\u0646\u062F \u0644\u0645\u0633 \u0645\u0646\u0637\u0642\u0629 \u0628\u0639\u064A\u0646\u0647\u0627 \u0641\u0647\u0630\u0647 \u0625\u0634\u0627\u0631\u0629 \u0625\u0644\u0649 \u0623\u0644\u0645 \u0623\u0648 \u0627\u0646\u0632\u0639\u0627\u062C \u0647\u0646\u0627\u0643.","\u0627\u0644\u062A\u0642\u0637 \u0635\u0648\u0631\u064B\u0627 \u0648\u0627\u0636\u062D\u0629 \u0645\u0646 \u0642\u0631\u064A\u0628 \u0648\u0641\u064A \u0636\u0648\u0621 \u0627\u0644\u0646\u0647\u0627\u0631\u060C \u0648\u0636\u0639 \u0628\u062C\u0627\u0646\u0628 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0639\u0645\u0644\u0629 \u0623\u0648 \u0645\u0633\u0637\u0631\u0629 \u0644\u062A\u0648\u0636\u064A\u062D \u0627\u0644\u062D\u062C\u0645. \u0635\u0648\u0651\u0631 \u0628\u0646\u0641\u0633 \u0627\u0644\u0632\u0627\u0648\u064A\u0629 \u0643\u0644 \u0628\u0636\u0639\u0629 \u0623\u064A\u0627\u0645 \u0644\u062A\u062A\u0627\u0628\u0639 \u0647\u0644 \u062A\u062A\u062D\u0633\u0646 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0623\u0645 \u062A\u062A\u0633\u0639. \u0647\u0630\u0647 \u0627\u0644\u0635\u0648\u0631 \u0647\u064A \u0646\u0641\u0633\u0647\u0627 \u0645\u0627 \u062A\u0631\u0641\u0639\u0647 \u0625\u0644\u0649 \u0627\u0644\u0641\u062D\u0635 \u0628\u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064A.","\u0627\u0639\u062A\u0645\u062F \u0639\u0644\u0649 \u0635\u0648\u0631\u0643 \u0648\u0645\u0644\u0627\u062D\u0638\u0627\u062A\u0643 \u0639\u0646\u062F\u0645\u0627 \u062A\u062A\u0633\u0639 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0623\u0648 \u062A\u062A\u0642\u0631\u062D \u0623\u0648 \u064A\u0646\u0632\u0641 \u0645\u0646\u0647\u0627 \u0634\u064A\u0621\u060C \u0623\u0648 \u0625\u0630\u0627 \u0638\u0647\u0631 \u0645\u0639\u0647\u0627 \u062E\u0645\u0648\u0644 \u0648\u0641\u0642\u062F\u0627\u0646 \u0634\u0647\u064A\u0629. \u0627\u0644\u0641\u062D\u0635 \u0627\u0644\u062F\u0648\u0631\u064A \u0645\u0631\u0629 \u0623\u0633\u0628\u0648\u0639\u064A\u064B\u0627 \u064A\u0643\u0641\u064A \u0644\u0627\u0643\u062A\u0634\u0627\u0641 \u0645\u0639\u0638\u0645 \u0627\u0644\u062A\u063A\u064A\u0651\u0631\u0627\u062A \u0645\u0628\u0643\u0631\u064B\u0627."],en:["Pick a calm moment with good light and run your hands over your pet from head to tail. Check the eyes, ears, mouth, teeth, belly, nails and the area around the tail, where problems like to hide.","Look for new swellings or lumps, discharge from the eyes, nose or ears, an unusual smell from the mouth or ears, or pain when touched. Watch your pet's behaviour during the check: pulling away or flinching when a spot is touched points to pain or discomfort there.","Take clear close-ups in daylight and place a coin or ruler next to the area to show its size. Photograph from the same angle every few days to see whether it is improving or spreading. These are the same photos you can upload to the AI scan.","Rely on your photos and notes when an area grows, breaks open or oozes, or when it comes with low energy and loss of appetite. A weekly check is enough to catch most changes early."]},"nutrition-basics":{ar:["\u0627\u0644\u063A\u0630\u0627\u0621 \u0627\u0644\u0645\u062A\u0648\u0627\u0632\u0646 \u064A\u062C\u0645\u0639 \u0627\u0644\u0628\u0631\u0648\u062A\u064A\u0646 \u0639\u0627\u0644\u064A \u0627\u0644\u062C\u0648\u062F\u0629\u060C \u0648\u0627\u0644\u062F\u0647\u0648\u0646 \u0627\u0644\u0635\u062D\u064A\u0629\u060C \u0648\u0642\u062F\u0631\u064B\u0627 \u0645\u0646\u0627\u0633\u0628\u064B\u0627 \u0645\u0646 \u0627\u0644\u0643\u0631\u0628\u0648\u0647\u064A\u062F\u0631\u0627\u062A \u0648\u0627\u0644\u0623\u0644\u064A\u0627\u0641\u060C \u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0627\u0644\u0641\u064A\u062A\u0627\u0645\u064A\u0646\u0627\u062A \u0648\u0627\u0644\u0645\u0639\u0627\u062F\u0646. \u0627\u0644\u0642\u0637\u0637 \u0645\u0646 \u0627\u0644\u0644\u0648\u0627\u062D\u0645 \u0627\u0644\u0635\u0627\u0631\u0645\u0629 \u0648\u062A\u062D\u062A\u0627\u062C \u0646\u0633\u0628\u0629 \u0628\u0631\u0648\u062A\u064A\u0646 \u062D\u064A\u0648\u0627\u0646\u064A \u0623\u0639\u0644\u0649\u060C \u0623\u0645\u0627 \u0627\u0644\u0643\u0644\u0627\u0628 \u0641\u062A\u062A\u062D\u0645\u0644 \u0646\u0638\u0627\u0645\u064B\u0627 \u0623\u0643\u062B\u0631 \u062A\u0646\u0648\u0639\u064B\u0627. \u0627\u062E\u062A\u0631 \u0637\u0639\u0627\u0645\u064B\u0627 \u0645\u0643\u062A\u0648\u0628\u064B\u0627 \u0639\u0644\u064A\u0647 \u0623\u0646\u0647 \u0643\u0627\u0645\u0644 \u0648\u0645\u062A\u0648\u0627\u0632\u0646 \u0644\u0645\u0631\u062D\u0644\u0629 \u0639\u0645\u0631 \u062D\u064A\u0648\u0627\u0646\u0643.","\u0642\u0633\u0651\u0645 \u0627\u0644\u0637\u0639\u0627\u0645 \u0639\u0644\u0649 \u0648\u062C\u0628\u062A\u064A\u0646 \u0623\u0648 \u0623\u0643\u062B\u0631 \u064A\u0648\u0645\u064A\u064B\u0627 \u0641\u064A \u0645\u0648\u0627\u0639\u064A\u062F \u062B\u0627\u0628\u062A\u0629\u060C \u0648\u0627\u0644\u062A\u0632\u0645 \u0628\u0627\u0644\u0643\u0645\u064A\u0627\u062A \u0627\u0644\u0645\u0643\u062A\u0648\u0628\u0629 \u0639\u0644\u0649 \u0627\u0644\u0639\u0628\u0648\u0629 \u0648\u0639\u062F\u0651\u0644\u0647\u0627 \u062D\u0633\u0628 \u0627\u0644\u0646\u0634\u0627\u0637 \u0648\u0627\u0644\u0648\u0632\u0646. \u0642\u0644\u0651\u0644 \u0627\u0644\u0648\u062C\u0628\u0627\u062A \u0627\u0644\u062E\u0641\u064A\u0641\u0629 \u0648\u0627\u0644\u0628\u0642\u0627\u064A\u0627\u060C \u0648\u063A\u064A\u0651\u0631 \u0646\u0648\u0639 \u0627\u0644\u0637\u0639\u0627\u0645 \u062A\u062F\u0631\u064A\u062C\u064A\u064B\u0627 \u062E\u0644\u0627\u0644 \u0623\u0633\u0628\u0648\u0639 \u062A\u0642\u0631\u064A\u0628\u064B\u0627 \u0644\u062A\u062C\u0646\u0651\u0628 \u0627\u0636\u0637\u0631\u0627\u0628 \u0627\u0644\u0647\u0636\u0645.","\u0627\u0644\u0645\u0627\u0621 \u0627\u0644\u0639\u0630\u0628 \u0627\u0644\u0646\u0638\u064A\u0641 \u064A\u062C\u0628 \u0623\u0646 \u064A\u0643\u0648\u0646 \u0645\u062A\u0627\u062D\u064B\u0627 \u062F\u0627\u0626\u0645\u064B\u0627. \u0648\u0644\u0623\u0646 \u0627\u0644\u0642\u0637\u0637 \u0644\u0627 \u062A\u0634\u0631\u0628 \u0643\u062B\u064A\u0631\u064B\u0627 \u0628\u0637\u0628\u064A\u0639\u062A\u0647\u0627\u060C \u0641\u0642\u062F \u064A\u0633\u0627\u0639\u062F\u0647\u0627 \u0648\u0636\u0639 \u0623\u0643\u062B\u0631 \u0645\u0646 \u0648\u0639\u0627\u0621 \u0641\u064A \u0623\u0645\u0627\u0643\u0646 \u0645\u062E\u062A\u0644\u0641\u0629 \u0623\u0648 \u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0646\u0627\u0641\u0648\u0631\u0629 \u0645\u064A\u0627\u0647 \u0623\u0648 \u0625\u0636\u0627\u0641\u0629 \u0627\u0644\u0637\u0639\u0627\u0645 \u0627\u0644\u0631\u0637\u0628 \u0625\u0644\u0649 \u0646\u0638\u0627\u0645\u0647\u0627.","\u062A\u062E\u062A\u0644\u0641 \u0627\u0644\u0627\u062D\u062A\u064A\u0627\u062C\u0627\u062A \u0628\u062D\u0633\u0628 \u0627\u0644\u0639\u0645\u0631 \u0648\u0627\u0644\u062D\u062C\u0645 \u0648\u0627\u0644\u0646\u0634\u0627\u0637: \u0627\u0644\u0635\u063A\u0627\u0631 \u062A\u062D\u062A\u0627\u062C \u0633\u0639\u0631\u0627\u062A \u0648\u0628\u0631\u0648\u062A\u064A\u0646\u064B\u0627 \u0623\u0643\u062B\u0631\u060C \u0648\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646 \u062A\u062D\u062A\u0627\u062C \u0637\u0639\u0627\u0645\u064B\u0627 \u0623\u062E\u0641. \u0648\u0645\u0646 \u0627\u0644\u0623\u0637\u0639\u0645\u0629 \u0627\u0644\u062E\u0637\u0631\u0629 \u0639\u0644\u0649 \u0627\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A \u0627\u0644\u0634\u0648\u0643\u0648\u0644\u0627\u062A\u0629 \u0648\u0627\u0644\u0639\u0646\u0628 \u0648\u0627\u0644\u0632\u0628\u064A\u0628 \u0648\u0627\u0644\u0628\u0635\u0644 \u0648\u0627\u0644\u062B\u0648\u0645 \u0648\u0627\u0644\u0623\u0641\u0648\u0643\u0627\u062F\u0648 \u0648\u0627\u0644\u0645\u062D\u0644\u0651\u064A\u0627\u062A \u0627\u0644\u0635\u0646\u0627\u0639\u064A\u0629\u060C \u0641\u0627\u0628\u0639\u062F\u0647\u0627 \u0639\u0646 \u0645\u062A\u0646\u0627\u0648\u0644\u0647."],en:["A balanced diet combines high-quality protein, healthy fats, suitable carbohydrates and fibre, plus vitamins and minerals. Cats are strict carnivores and need more animal protein, while dogs cope with a more varied diet. Choose food labelled complete and balanced for your pet's life stage.","Split food into two or more meals a day at fixed times, follow the amounts on the pack and adjust for activity and weight. Keep treats and leftovers low, and switch foods gradually over about a week to avoid digestive upset.","Fresh, clean water should always be available. Cats naturally drink little, so several bowls in different spots, a water fountain or some wet food in the diet can help.","Needs vary with age, size and activity: young animals need more calories and protein, and seniors need lighter food. Foods that are dangerous for pets include chocolate, grapes and raisins, onions, garlic, avocado and artificial sweeteners, so keep them out of reach."]},"bathing-and-hygiene":{ar:["\u0645\u0639\u0638\u0645 \u0627\u0644\u0643\u0644\u0627\u0628 \u062A\u0643\u0641\u064A\u0647\u0627 \u0627\u0633\u062A\u062D\u0645\u0627\u0645\u0629 \u0643\u0644 \u0623\u0631\u0628\u0639\u0629 \u0625\u0644\u0649 \u062B\u0645\u0627\u0646\u064A\u0629 \u0623\u0633\u0627\u0628\u064A\u0639\u060C \u0623\u0648 \u0639\u0646\u062F \u0627\u062A\u0633\u0627\u062E\u0647\u0627. \u0623\u0645\u0627 \u0627\u0644\u0642\u0637\u0637 \u0641\u062A\u0646\u0638\u0651\u0641 \u0646\u0641\u0633\u0647\u0627 \u0628\u0646\u0641\u0633\u0647\u0627 \u0648\u0646\u0627\u062F\u0631\u064B\u0627 \u0645\u0627 \u062A\u062D\u062A\u0627\u062C \u0625\u0644\u0649 \u062D\u0645\u0651\u0627\u0645. \u0628\u0644\u0651\u0644 \u0627\u0644\u0641\u0631\u0648 \u0628\u0645\u0627\u0621 \u0641\u0627\u062A\u0631\u060C \u0648\u062F\u0644\u0651\u0643\u0647 \u0628\u0644\u0637\u0641\u060C \u0648\u062A\u062C\u0646\u0651\u0628 \u062F\u062E\u0648\u0644 \u0627\u0644\u0645\u0627\u0621 \u0625\u0644\u0649 \u0627\u0644\u0623\u0630\u0646\u064A\u0646 \u0648\u0627\u0644\u0639\u064A\u0646\u064A\u0646\u060C \u062B\u0645 \u0627\u0634\u0637\u0641 \u062C\u064A\u062F\u064B\u0627 \u062D\u062A\u0649 \u0644\u0627 \u064A\u0628\u0642\u0649 \u0623\u064A \u0623\u062B\u0631 \u0644\u0644\u0634\u0627\u0645\u0628\u0648.","\u0627\u0633\u062A\u062E\u062F\u0645 \u0634\u0627\u0645\u0628\u0648 \u0645\u062E\u0635\u0635\u064B\u0627 \u0644\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A \u0641\u0642\u0637\u060C \u0644\u0623\u0646 \u062C\u0644\u062F\u0647\u0645 \u0623\u0642\u0644 \u062D\u0645\u0648\u0636\u0629 \u0645\u0646 \u062C\u0644\u062F \u0627\u0644\u0625\u0646\u0633\u0627\u0646 \u0648\u0642\u062F \u062A\u062C\u0641\u0651\u0641\u0647 \u0645\u0646\u062A\u062C\u0627\u062A\u0646\u0627 \u0648\u062A\u0647\u064A\u0651\u062C\u0647. \u0627\u062E\u062A\u0631 \u062A\u0631\u0643\u064A\u0628\u0629 \u0644\u0637\u064A\u0641\u0629 \u0648\u062E\u0627\u0644\u064A\u0629 \u0645\u0646 \u0627\u0644\u0639\u0637\u0648\u0631 \u0627\u0644\u0642\u0648\u064A\u0629\u060C \u0648\u0627\u0628\u062D\u062B \u0639\u0646 \u0627\u0644\u0646\u0648\u0639 \u0627\u0644\u0645\u0646\u0627\u0633\u0628 \u0644\u0644\u062C\u0644\u062F \u0627\u0644\u062D\u0633\u0627\u0633 \u0625\u0646 \u0643\u0627\u0646 \u062D\u064A\u0648\u0627\u0646\u0643 \u0643\u062B\u064A\u0631 \u0627\u0644\u062D\u0643\u0651\u0629.","\u062C\u0641\u0651\u0641 \u0627\u0644\u0641\u0631\u0648 \u0628\u0645\u0646\u0634\u0641\u0629 \u0646\u0638\u064A\u0641\u0629 \u062B\u0645 \u0628\u0645\u062C\u0641\u0641 \u0639\u0644\u0649 \u0647\u0648\u0627\u0621 \u062F\u0627\u0641\u0626 \u0645\u0646\u062E\u0641\u0636 \u0625\u0646 \u062A\u0642\u0628\u0651\u0644\u0647 \u0627\u0644\u062D\u064A\u0648\u0627\u0646\u060C \u062E\u0627\u0635\u0629 \u0641\u064A \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0643\u062B\u064A\u0641\u0629 \u0627\u0644\u0641\u0631\u0648. \u0628\u0642\u0627\u0621 \u0627\u0644\u0631\u0637\u0648\u0628\u0629 \u0639\u0646\u062F \u0627\u0644\u062C\u0644\u062F \u064A\u0634\u062C\u0651\u0639 \u0639\u0644\u0649 \u0646\u0645\u0648 \u0627\u0644\u0641\u0637\u0631\u064A\u0627\u062A \u0648\u0627\u0644\u0628\u0643\u062A\u064A\u0631\u064A\u0627\u060C \u0641\u0627\u0646\u062A\u0628\u0647 \u0625\u0644\u0649 \u062B\u0646\u064A\u0627\u062A \u0627\u0644\u062C\u0644\u062F \u0648\u0645\u0627 \u0628\u064A\u0646 \u0627\u0644\u0623\u0635\u0627\u0628\u0639.","\u0627\u0645\u0646\u062D \u062D\u064A\u0648\u0627\u0646\u0643 \u0645\u0643\u0627\u0641\u0623\u0629 \u0648\u062C\u0648\u064B\u0627 \u0647\u0627\u062F\u0626\u064B\u0627 \u0628\u0639\u062F \u0627\u0644\u062D\u0645\u0651\u0627\u0645\u060C \u0648\u0627\u0645\u0634\u0651\u0637 \u0627\u0644\u0641\u0631\u0648 \u0644\u0645\u0646\u0639 \u0627\u0644\u062A\u0639\u0642\u0651\u062F. \u0648\u0646\u0638\u0651\u0641 \u0627\u0644\u0623\u0630\u0646\u064A\u0646 \u0648\u0627\u0644\u0645\u062E\u0627\u0644\u0628 \u0648\u0627\u0644\u0623\u0633\u0646\u0627\u0646 \u0628\u0627\u0646\u062A\u0638\u0627\u0645 \u0628\u062D\u0633\u0628 \u062D\u0627\u062C\u0629 \u0643\u0644 \u0645\u0646\u0647\u0627\u060C \u0648\u0627\u063A\u0633\u0644 \u0641\u0631\u0627\u0634\u0647 \u0648\u0623\u0644\u0639\u0627\u0628\u0647 \u0628\u064A\u0646 \u0641\u062A\u0631\u0629 \u0648\u0623\u062E\u0631\u0649 \u0644\u0644\u062D\u0641\u0627\u0638 \u0639\u0644\u0649 \u0628\u064A\u0626\u0629 \u0646\u0638\u064A\u0641\u0629."],en:["Most dogs do well with a bath every four to eight weeks, or when they get dirty. Cats clean themselves and rarely need one. Wet the coat with lukewarm water, massage gently, keep water out of ears and eyes, and rinse thoroughly so no shampoo is left behind.","Use shampoo made for pets only, because their skin is less acidic than ours and human products can dry and irritate it. Pick a gentle formula without strong fragrance, and look for a sensitive-skin version if your pet itches a lot.","Dry the coat with a clean towel and then a dryer on low, warm air if your pet accepts it, especially in thick-coated breeds. Lingering moisture on the skin encourages fungus and bacteria, so mind the skin folds and between the toes.","Give your pet a treat and a quiet space after the bath, and brush the coat to prevent tangles. Clean ears, nails and teeth as each needs it, and wash bedding and toys from time to time to keep the environment clean."]},"external-parasites-overview":{ar:["\u0627\u0644\u0628\u0631\u0627\u063A\u064A\u062B \u062D\u0634\u0631\u0627\u062A \u0635\u063A\u064A\u0631\u0629 \u0633\u0631\u064A\u0639\u0629 \u0627\u0644\u0642\u0641\u0632 \u062A\u0639\u064A\u0634 \u0639\u0644\u0649 \u0627\u0644\u0641\u0631\u0648 \u0648\u062A\u062A\u063A\u0630\u0649 \u0639\u0644\u0649 \u0627\u0644\u062F\u0645\u060C \u0648\u062A\u0633\u0628\u0628 \u062D\u0643\u0651\u0629 \u0634\u062F\u064A\u062F\u0629 \u0648\u0642\u062F \u062A\u0624\u062F\u064A \u0625\u0644\u0649 \u0627\u0644\u062A\u0647\u0627\u0628 \u062C\u0644\u062F\u064A \u062A\u062D\u0633\u0633\u064A. \u0645\u0646 \u0639\u0644\u0627\u0645\u0627\u062A\u0647\u0627 \u0638\u0647\u0648\u0631 \u062D\u0628\u064A\u0628\u0627\u062A \u0633\u0648\u062F\u0627\u0621 \u0635\u063A\u064A\u0631\u0629 \u0641\u064A \u0627\u0644\u0641\u0631\u0648 \u062A\u0634\u0628\u0647 \u0627\u0644\u0641\u0644\u0641\u0644\u060C \u0648\u0647\u064A \u0641\u0636\u0644\u0627\u062A \u0627\u0644\u0628\u0631\u0627\u063A\u064A\u062B\u060C \u0648\u062A\u0646\u062A\u0634\u0631 \u0628\u0633\u0631\u0639\u0629 \u0641\u064A \u0627\u0644\u0645\u0646\u0632\u0644 \u0625\u0630\u0627 \u0644\u0645 \u062A\u064F\u0639\u0627\u0644\u062C.","\u0627\u0644\u0642\u0631\u0627\u062F \u0639\u0646\u0627\u0643\u0628 \u0635\u063A\u064A\u0631\u0629 \u062A\u0644\u062A\u0635\u0642 \u0628\u0627\u0644\u062C\u0644\u062F \u0648\u062A\u0645\u062A\u0635 \u0627\u0644\u062F\u0645\u060C \u0648\u062A\u0643\u062B\u0631 \u0641\u064A \u0627\u0644\u0623\u0639\u0634\u0627\u0628 \u0648\u0627\u0644\u0645\u0646\u0627\u0637\u0642 \u0627\u0644\u0645\u0641\u062A\u0648\u062D\u0629. \u064A\u0638\u0647\u0631 \u0643\u062D\u0628\u0629 \u0635\u063A\u064A\u0631\u0629 \u0645\u062A\u0635\u0644\u0629 \u0628\u0627\u0644\u062C\u0644\u062F \u062A\u0646\u062A\u0641\u062E \u0645\u0639 \u0627\u0645\u062A\u0644\u0627\u0626\u0647\u0627 \u0628\u0627\u0644\u062F\u0645\u060C \u0648\u063A\u0627\u0644\u0628\u064B\u0627 \u0645\u0627 \u062A\u064F\u0631\u0649 \u062D\u0648\u0644 \u0627\u0644\u0631\u0623\u0633 \u0648\u0627\u0644\u0623\u0630\u0646\u064A\u0646 \u0648\u0627\u0644\u0631\u0642\u0628\u0629. \u0627\u0641\u062D\u0635 \u062D\u064A\u0648\u0627\u0646\u0643 \u0628\u0639\u062F \u0643\u0644 \u062E\u0631\u0648\u062C\u0629 \u0625\u0644\u0649 \u0627\u0644\u062E\u0627\u0631\u062C.","\u0627\u0644\u0639\u062B \u0645\u062E\u0644\u0648\u0642\u0627\u062A \u0645\u062C\u0647\u0631\u064A\u0629\u060C \u0648\u0645\u0646\u0647\u0627 \u0645\u0627 \u064A\u0633\u0628\u0628 \u0627\u0644\u062C\u0631\u0628 \u0648\u0639\u062B \u0627\u0644\u0623\u0630\u0646. \u064A\u0633\u0628\u0628 \u062D\u0643\u0651\u0629 \u0634\u062F\u064A\u062F\u0629 \u0648\u0642\u0634\u0648\u0631\u064B\u0627 \u0648\u062A\u0633\u0627\u0642\u0637 \u0634\u0639\u0631\u060C \u0648\u0642\u062F \u064A\u0638\u0647\u0631 \u0641\u064A \u0627\u0644\u0623\u0630\u0646 \u0625\u0641\u0631\u0627\u0632 \u062F\u0627\u0643\u0646 \u064A\u0634\u0628\u0647 \u0627\u0644\u0642\u0647\u0648\u0629 \u0627\u0644\u0645\u0637\u062D\u0648\u0646\u0629. \u0648\u0628\u0639\u0636 \u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u0639\u062B \u0645\u0639\u062F\u064D \u0628\u064A\u0646 \u0627\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A\u060C \u0644\u0630\u0644\u0643 \u064A\u064F\u0639\u0632\u0644 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0627\u0644\u0645\u0635\u0627\u0628 \u0639\u0646 \u0627\u0644\u0622\u062E\u0631\u064A\u0646.","\u0627\u0644\u0648\u0642\u0627\u064A\u0629 \u062A\u0639\u062A\u0645\u062F \u0639\u0644\u0649 \u0645\u0646\u062A\u062C\u0627\u062A \u0645\u0636\u0627\u062F\u0629 \u0644\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A \u0645\u0646 \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u0645\u0639\u062A\u0645\u062F\u0629 \u0648\u0628\u062D\u0633\u0628 \u0648\u0632\u0646 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0648\u0639\u0645\u0631\u0647\u060C \u0648\u062A\u0646\u0638\u064A\u0641 \u0627\u0644\u0645\u0646\u0632\u0644 \u0648\u063A\u0633\u0644 \u0627\u0644\u0641\u0631\u0627\u0634 \u0628\u0627\u0646\u062A\u0638\u0627\u0645\u060C \u0648\u062A\u0645\u0634\u064A\u0637 \u0627\u0644\u0641\u0631\u0648 \u0628\u0645\u0634\u0637 \u0646\u0627\u0639\u0645 \u0644\u0644\u0628\u0631\u0627\u063A\u064A\u062B\u060C \u0648\u0645\u0639\u0627\u0644\u062C\u0629 \u062C\u0645\u064A\u0639 \u0627\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A \u0641\u064A \u0627\u0644\u0628\u064A\u062A \u0645\u0639\u064B\u0627 \u062D\u062A\u0649 \u0644\u0627 \u062A\u0646\u062A\u0642\u0644 \u0627\u0644\u0639\u062F\u0648\u0649 \u0628\u064A\u0646\u0647\u0627."],en:["Fleas are tiny, fast-jumping insects that live in the coat and feed on blood. They cause intense itching and can trigger allergic skin inflammation. A common sign is small black specks in the fur that look like pepper: flea droppings. They spread quickly through the home if left untreated.","Ticks are small arachnids that attach to the skin and feed on blood, common in grass and open areas. They look like a small bump attached to the skin that swells as it fills, often around the head, ears and neck. Check your pet after every outing.","Mites are microscopic, and some cause mange and ear mites. They bring intense itching, flaking and hair loss, and ear mites may leave a dark discharge like ground coffee. Some mites pass between animals, so an affected pet is kept apart from others.","Prevention relies on approved anti-parasite products chosen by weight and age, regular home cleaning and bedding washes, combing with a fine flea comb, and treating every pet in the household together so the problem doesn't pass back and forth."]},"preventive-care-guide":{ar:["\u0627\u0644\u0648\u0642\u0627\u064A\u0629 \u0623\u0633\u0647\u0644 \u0648\u0623\u0631\u062E\u0635 \u0645\u0646 \u0627\u0644\u0639\u0644\u0627\u062C. \u0641\u0627\u0644\u062A\u0637\u0639\u064A\u0645\u0627\u062A \u0648\u0645\u0636\u0627\u062F\u0627\u062A \u0627\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A \u0648\u0627\u0644\u062A\u063A\u0630\u064A\u0629 \u0627\u0644\u062C\u064A\u062F\u0629 \u0648\u0627\u0644\u0641\u062D\u0635 \u0627\u0644\u0645\u0646\u062A\u0638\u0645 \u062A\u062D\u0645\u064A \u062D\u064A\u0648\u0627\u0646\u0643 \u0645\u0646 \u0623\u0645\u0631\u0627\u0636 \u062E\u0637\u064A\u0631\u0629 \u0643\u062B\u064A\u0631\u0629\u060C \u0648\u062A\u0633\u0627\u0639\u062F \u0639\u0644\u0649 \u0627\u0643\u062A\u0634\u0627\u0641 \u0627\u0644\u0645\u0634\u0643\u0644\u0627\u062A \u0648\u0647\u064A \u0645\u0627 \u062A\u0632\u0627\u0644 \u0628\u0633\u064A\u0637\u0629. \u0648\u0647\u064A \u0643\u0630\u0644\u0643 \u062A\u062D\u0645\u064A \u0623\u0641\u0631\u0627\u062F \u0627\u0644\u0623\u0633\u0631\u0629 \u0645\u0646 \u0627\u0644\u0623\u0645\u0631\u0627\u0636 \u0627\u0644\u0645\u0634\u062A\u0631\u0643\u0629.","\u064A\u064F\u0646\u0635\u062D \u0639\u0627\u062F\u0629 \u0628\u0641\u062D\u0635 \u0634\u0627\u0645\u0644 \u0645\u0631\u0629 \u0641\u064A \u0627\u0644\u0633\u0646\u0629 \u0644\u0644\u062D\u064A\u0648\u0627\u0646 \u0627\u0644\u0628\u0627\u0644\u063A\u060C \u0648\u0645\u0631\u0629 \u0643\u0644 \u0633\u062A\u0629 \u0623\u0634\u0647\u0631 \u0644\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646\u060C \u0648\u0632\u064A\u0627\u0631\u0627\u062A \u0623\u0643\u062B\u0631 \u062A\u0643\u0631\u0627\u0631\u064B\u0627 \u0644\u0644\u0635\u063A\u0627\u0631 \u0641\u064A \u0623\u0634\u0647\u0631\u0647\u0645 \u0627\u0644\u0623\u0648\u0644\u0649. \u0648\u062E\u0644\u0627\u0644 \u0627\u0644\u0632\u064A\u0627\u0631\u0629 \u064A\u064F\u0642\u0627\u0633 \u0627\u0644\u0648\u0632\u0646 \u0648\u062A\u064F\u0641\u062D\u0635 \u0627\u0644\u0623\u0633\u0646\u0627\u0646 \u0648\u0627\u0644\u0642\u0644\u0628 \u0648\u0627\u0644\u062C\u0644\u062F \u0648\u0627\u0644\u0639\u064A\u0646\u0627\u0646 \u0648\u0627\u0644\u0623\u0630\u0646\u0627\u0646.","\u0627\u062D\u062A\u0641\u0638 \u0628\u062F\u0641\u062A\u0631 \u0623\u0648 \u0645\u0644\u0641 \u0625\u0644\u0643\u062A\u0631\u0648\u0646\u064A \u0641\u064A\u0647 \u062A\u0648\u0627\u0631\u064A\u062E \u0643\u0644 \u062A\u0637\u0639\u064A\u0645 \u0648\u062C\u0631\u0639\u0629 \u0645\u0636\u0627\u062F\u0629 \u0644\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A \u0648\u0646\u062A\u0627\u0626\u062C \u0627\u0644\u0641\u062D\u0648\u0635 \u0648\u0627\u0644\u0623\u062F\u0648\u064A\u0629 \u0627\u0644\u062A\u064A \u0627\u0633\u062A\u064F\u062E\u062F\u0645\u062A. \u0647\u0630\u0627 \u0627\u0644\u0633\u062C\u0644 \u064A\u0633\u0647\u0651\u0644 \u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0629\u060C \u0648\u064A\u0644\u0632\u0645\u0643 \u0639\u0646\u062F \u0627\u0644\u0633\u0641\u0631 \u0623\u0648 \u0627\u0644\u0625\u064A\u0648\u0627\u0621 \u0623\u0648 \u062A\u063A\u064A\u064A\u0631 \u0627\u0644\u0639\u064A\u0627\u062F\u0629.","\u0645\u0646 \u0627\u0644\u0623\u0633\u0626\u0644\u0629 \u0627\u0644\u0645\u0641\u064A\u062F\u0629: \u0645\u0627 \u0627\u0644\u062A\u0637\u0639\u064A\u0645\u0627\u062A \u0627\u0644\u0645\u0646\u0627\u0633\u0628\u0629 \u0644\u0639\u0645\u0631 \u062D\u064A\u0648\u0627\u0646\u064A \u0648\u0646\u0645\u0637 \u062D\u064A\u0627\u062A\u0647\u061F \u0648\u0645\u0627 \u0627\u0644\u0648\u0632\u0646 \u0627\u0644\u0645\u062B\u0627\u0644\u064A \u0644\u0647\u061F \u0648\u0645\u0627 \u0627\u0644\u062C\u062F\u0648\u0644 \u0627\u0644\u0645\u0646\u0627\u0633\u0628 \u0644\u0645\u0636\u0627\u062F\u0627\u062A \u0627\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A\u061F \u0648\u0643\u064A\u0641 \u0623\u0639\u062A\u0646\u064A \u0628\u0623\u0633\u0646\u0627\u0646\u0647\u061F \u0648\u0647\u0644 \u0647\u0646\u0627\u0643 \u0623\u0645\u0631\u0627\u0636 \u0634\u0627\u0626\u0639\u0629 \u0641\u064A \u0645\u0646\u0637\u0642\u062A\u0646\u0627 \u064A\u062C\u0628 \u0627\u0644\u0627\u0646\u062A\u0628\u0627\u0647 \u0625\u0644\u064A\u0647\u0627\u061F"],en:["Prevention is easier and cheaper than treatment. Vaccinations, parasite control, good nutrition and regular check-ups protect your pet from many serious illnesses and help catch problems while they're still small. They also protect family members from shared diseases.","A full check-up once a year is typical for an adult animal, every six months for seniors, with more frequent visits for young ones in their first months. A visit usually covers weight, teeth, heart, skin, eyes and ears.","Keep a notebook or digital file with the dates of every vaccine and parasite dose, test results and medicines used. This record makes follow-up easier and is needed for travel, boarding or changing clinics.","Useful questions: Which vaccines suit my pet's age and lifestyle? What is their ideal weight? What parasite schedule fits? How should I care for their teeth? Are there common illnesses in our area to watch for?"]},"signs-not-to-ignore":{ar:["\u062A\u063A\u064A\u0651\u0631 \u0645\u0641\u0627\u062C\u0626 \u0641\u064A \u0627\u0644\u0637\u0628\u0627\u0639 \u064A\u0633\u062A\u062D\u0642 \u0627\u0644\u0627\u0646\u062A\u0628\u0627\u0647: \u0642\u0637\u0629 \u0647\u0627\u062F\u0626\u0629 \u062A\u0635\u0628\u062D \u0639\u062F\u0648\u0627\u0646\u064A\u0629 \u0623\u0648 \u062A\u062E\u062A\u0628\u0626\u060C \u0623\u0648 \u0643\u0644\u0628 \u0646\u0634\u064A\u0637 \u064A\u0635\u064A\u0631 \u062E\u0627\u0645\u0644\u064B\u0627 \u0648\u0644\u0627 \u064A\u0631\u064A\u062F \u0627\u0644\u0644\u0639\u0628. \u0643\u0630\u0644\u0643 \u0627\u0644\u062A\u0628\u0648\u0651\u0644 \u062E\u0627\u0631\u062C \u0627\u0644\u0645\u0643\u0627\u0646 \u0627\u0644\u0645\u0639\u062A\u0627\u062F\u060C \u0623\u0648 \u0627\u0644\u0645\u0648\u0627\u0621 \u0648\u0627\u0644\u0646\u0628\u0627\u062D \u0627\u0644\u0645\u062A\u0648\u0627\u0635\u0644\u060C \u0623\u0648 \u0627\u0644\u0627\u0646\u0637\u0648\u0627\u0621 \u0648\u0627\u0644\u0627\u0628\u062A\u0639\u0627\u062F \u0639\u0646 \u0627\u0644\u0623\u0633\u0631\u0629.","\u0627\u0644\u0627\u0645\u062A\u0646\u0627\u0639 \u0639\u0646 \u0627\u0644\u0623\u0643\u0644 \u0623\u0643\u062B\u0631 \u0645\u0646 \u064A\u0648\u0645\u060C \u0623\u0648 \u0627\u0644\u0639\u0637\u0634 \u0627\u0644\u0634\u062F\u064A\u062F \u0627\u0644\u0645\u0641\u0627\u062C\u0626\u060C \u0623\u0648 \u0641\u0642\u062F\u0627\u0646 \u0627\u0644\u0648\u0632\u0646 \u0623\u0648 \u0632\u064A\u0627\u062F\u062A\u0647 \u0628\u0633\u0631\u0639\u0629 \u062F\u0648\u0646 \u0633\u0628\u0628 \u0648\u0627\u0636\u062D\u060C \u0643\u0644\u0647\u0627 \u0625\u0634\u0627\u0631\u0627\u062A \u0625\u0644\u0649 \u0623\u0646 \u0634\u064A\u0626\u064B\u0627 \u0645\u0627 \u064A\u062D\u062F\u062B \u062F\u0627\u062E\u0644 \u0627\u0644\u062C\u0633\u0645. \u0648\u0639\u0646\u062F \u0627\u0644\u0642\u0637\u0637 \u062E\u0627\u0635\u0629\u060C \u0641\u0627\u0644\u0627\u0645\u062A\u0646\u0627\u0639 \u0639\u0646 \u0627\u0644\u0637\u0639\u0627\u0645 \u064A\u0635\u0628\u062D \u062E\u0637\u064A\u0631\u064B\u0627 \u0628\u0633\u0631\u0639\u0629 \u0646\u0633\u0628\u064A\u064B\u0627.","\u0627\u0646\u062A\u0628\u0647 \u0625\u0644\u0649 \u0627\u0644\u062A\u063A\u064A\u0651\u0631\u0627\u062A \u0627\u0644\u0638\u0627\u0647\u0631\u0629: \u062A\u0648\u0631\u0651\u0645\u0627\u062A \u0623\u0648 \u0643\u062A\u0644 \u062C\u062F\u064A\u062F\u0629\u060C \u0648\u062C\u0631\u0648\u062D \u0644\u0627 \u062A\u0644\u062A\u0626\u0645\u060C \u0648\u062A\u0633\u0627\u0642\u0637 \u0627\u0644\u0634\u0639\u0631\u060C \u0648\u0625\u0641\u0631\u0627\u0632\u0627\u062A \u0645\u0646 \u0627\u0644\u0639\u064A\u0646\u064A\u0646 \u0623\u0648 \u0627\u0644\u0623\u0646\u0641\u060C \u0648\u0641\u0631\u0648 \u0628\u0627\u0647\u062A\u060C \u0648\u062A\u063A\u064A\u0651\u0631 \u0627\u0644\u0648\u0632\u0646\u060C \u0648\u0631\u0627\u0626\u062D\u0629 \u063A\u064A\u0631 \u0645\u0639\u062A\u0627\u062F\u0629. \u0648\u064A\u0645\u0643\u0646\u0643 \u0631\u0641\u0639 \u0635\u0648\u0631\u0629 \u0641\u064A \u0627\u0644\u0641\u062D\u0635 \u0628\u0627\u0644\u0630\u0643\u0627\u0621 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064A \u0644\u0645\u0639\u0631\u0641\u0629 \u0627\u0644\u0645\u0632\u064A\u062F.","\u0627\u0637\u0644\u0628 \u0627\u0644\u0645\u0633\u0627\u0639\u062F\u0629 \u0627\u0644\u0645\u0647\u0646\u064A\u0629 \u0641\u0648\u0631\u064B\u0627 \u0639\u0646\u062F \u0635\u0639\u0648\u0628\u0629 \u0627\u0644\u062A\u0646\u0641\u0633\u060C \u0623\u0648 \u0627\u0644\u0642\u064A\u0621 \u0648\u0627\u0644\u0625\u0633\u0647\u0627\u0644 \u0627\u0644\u0645\u062A\u0643\u0631\u0631\u060C \u0623\u0648 \u0627\u0644\u0646\u0632\u064A\u0641\u060C \u0623\u0648 \u0627\u0644\u062A\u0634\u0646\u062C\u0627\u062A\u060C \u0623\u0648 \u0639\u062F\u0645 \u0627\u0644\u0642\u062F\u0631\u0629 \u0639\u0644\u0649 \u0627\u0644\u062A\u0628\u0648\u0644\u060C \u0623\u0648 \u0627\u0644\u0636\u0639\u0641 \u0627\u0644\u0634\u062F\u064A\u062F \u0648\u0627\u0644\u0627\u0646\u0647\u064A\u0627\u0631\u060C \u0623\u0648 \u0623\u064A \u062D\u0627\u0644\u0629 \u062A\u062A\u0641\u0627\u0642\u0645 \u0628\u0633\u0631\u0639\u0629. \u0641\u064A \u0647\u0630\u0647 \u0627\u0644\u062D\u0627\u0644\u0627\u062A \u0644\u0627 \u062A\u0646\u062A\u0638\u0631."],en:["A sudden change in temperament deserves attention: a calm cat turns aggressive or hides, or an active dog becomes lethargic and won't play. So do urinating outside the usual spot, constant meowing or barking, or withdrawing from the family.","Refusing food for more than a day, sudden intense thirst, or fast weight loss or gain without a clear reason all suggest something is going on inside. In cats especially, going without food becomes dangerous relatively quickly.","Watch for visible changes: new swellings or lumps, wounds that won't heal, hair loss, discharge from the eyes or nose, a dull coat, weight changes and an unusual smell. You can upload a photo to the AI scan to learn more.","Seek professional help immediately for trouble breathing, repeated vomiting or diarrhoea, bleeding, seizures, being unable to urinate, severe weakness or collapse, or any condition that worsens fast. In these cases, don't wait."]},"preparing-for-a-vet-visit":{ar:["\u062F\u0648\u0651\u0646 \u0645\u062A\u0649 \u0628\u062F\u0623\u062A \u0627\u0644\u0645\u0634\u0643\u0644\u0629\u060C \u0648\u0643\u064A\u0641 \u062A\u0637\u0648\u0631\u062A\u060C \u0648\u0645\u0627 \u0627\u0644\u0623\u0639\u0631\u0627\u0636 \u0627\u0644\u062A\u064A \u0644\u0627\u062D\u0638\u062A\u0647\u0627\u060C \u0648\u0645\u0627 \u0627\u0644\u0630\u064A \u064A\u0623\u0643\u0644\u0647 \u062D\u064A\u0648\u0627\u0646\u0643 \u0648\u064A\u0634\u0631\u0628\u0647\u060C \u0648\u0623\u064A \u062A\u063A\u064A\u064A\u0631 \u062D\u062F\u064A\u062B \u0641\u064A \u0627\u0644\u0637\u0639\u0627\u0645 \u0623\u0648 \u0627\u0644\u0628\u064A\u0626\u0629 \u0623\u0648 \u0627\u0644\u0623\u062F\u0648\u064A\u0629. \u0627\u0644\u062A\u0641\u0627\u0635\u064A\u0644 \u0627\u0644\u062F\u0642\u064A\u0642\u0629 \u062A\u0633\u0627\u0639\u062F \u0639\u0644\u0649 \u0627\u0644\u0648\u0635\u0648\u0644 \u0625\u0644\u0649 \u0627\u0644\u0635\u0648\u0631\u0629 \u0627\u0644\u0643\u0627\u0645\u0644\u0629 \u0628\u0633\u0631\u0639\u0629.","\u0627\u0644\u062A\u0642\u0637 \u0635\u0648\u0631\u064B\u0627 \u0648\u0645\u0642\u0627\u0637\u0639 \u0641\u064A\u062F\u064A\u0648 \u0642\u0635\u064A\u0631\u0629 \u0644\u0644\u0623\u0639\u0631\u0627\u0636 \u0643\u0645\u0627 \u062A\u0638\u0647\u0631 \u0641\u064A \u0627\u0644\u0645\u0646\u0632\u0644\u060C \u0641\u0627\u0644\u0639\u0644\u0627\u0645\u0627\u062A \u0642\u062F \u062A\u062E\u062A\u0641\u064A \u0641\u064A \u0627\u0644\u0639\u064A\u0627\u062F\u0629 \u0628\u0633\u0628\u0628 \u0627\u0644\u062A\u0648\u062A\u0631. \u0648\u0644\u0627 \u062A\u0646\u0633\u064E \u0635\u0648\u0631\u0629 \u0646\u062A\u0627\u0626\u062C \u0623\u064A \u062A\u062D\u0627\u0644\u064A\u0644 \u0623\u0648 \u0623\u0634\u0639\u0629 \u0633\u0627\u0628\u0642\u0629\u060C \u0648\u064A\u0645\u0643\u0646\u0643 \u0625\u0631\u0633\u0627\u0644\u0647\u0627 \u0625\u0644\u0649 \u0627\u0644\u0645\u0633\u062A\u0634\u0627\u0631 \u0627\u0644\u0630\u0643\u064A \u0644\u064A\u0634\u0631\u062D\u0647\u0627 \u0644\u0643 \u0642\u0628\u0644 \u0627\u0644\u0632\u064A\u0627\u0631\u0629.","\u062D\u0636\u0651\u0631 \u0623\u0633\u0626\u0644\u062A\u0643 \u0645\u0633\u0628\u0642\u064B\u0627: \u0645\u0627 \u0633\u0628\u0628 \u0627\u0644\u0645\u0634\u0643\u0644\u0629 \u0627\u0644\u0645\u062D\u062A\u0645\u0644\u061F \u0648\u0645\u0627 \u0627\u0644\u062E\u064A\u0627\u0631\u0627\u062A \u0627\u0644\u0645\u062A\u0627\u062D\u0629\u061F \u0648\u0643\u0645 \u062A\u0633\u062A\u063A\u0631\u0642 \u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0629\u061F \u0648\u0645\u0627 \u0627\u0644\u0639\u0644\u0627\u0645\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u0633\u062A\u062F\u0639\u064A \u0627\u0644\u0639\u0648\u062F\u0629\u061F \u0648\u0627\u0637\u0644\u0628 \u0643\u062A\u0627\u0628\u0629 \u062A\u0639\u0644\u064A\u0645\u0627\u062A \u0627\u0644\u062F\u0648\u0627\u0621 \u0628\u0648\u0636\u0648\u062D\u060C \u0645\u0646 \u062D\u064A\u062B \u0627\u0644\u062C\u0631\u0639\u0629 \u0648\u0627\u0644\u0645\u0648\u0627\u0639\u064A\u062F \u0648\u0627\u0644\u0645\u062F\u0629.","\u0628\u0639\u062F \u0627\u0644\u0632\u064A\u0627\u0631\u0629 \u0627\u0644\u062A\u0632\u0645 \u0628\u0627\u0644\u062F\u0648\u0627\u0621 \u062D\u062A\u0649 \u0646\u0647\u0627\u064A\u0629 \u0627\u0644\u0645\u062F\u0629 \u062D\u062A\u0649 \u0644\u0648 \u062A\u062D\u0633\u0646 \u062D\u064A\u0648\u0627\u0646\u0643\u060C \u0648\u0644\u0627\u062D\u0638 \u0623\u064A \u0622\u062B\u0627\u0631 \u062C\u0627\u0646\u0628\u064A\u0629\u060C \u0648\u0627\u0644\u062A\u0642\u0637 \u0635\u0648\u0631\u064B\u0627 \u062F\u0648\u0631\u064A\u0629 \u0644\u0645\u062A\u0627\u0628\u0639\u0629 \u0627\u0644\u062A\u062D\u0633\u0646. \u0648\u062D\u062F\u0651\u062F \u0645\u0648\u0639\u062F \u0627\u0644\u0645\u0631\u0627\u062C\u0639\u0629 \u0648\u062F\u0648\u0651\u0646\u0647 \u0641\u0648\u0631\u064B\u0627 \u062D\u062A\u0649 \u0644\u0627 \u064A\u0636\u064A\u0639."],en:["Write down when the problem started, how it has changed, which signs you noticed, what your pet eats and drinks, and any recent change in food, surroundings or medication. Precise details help reach the full picture quickly.","Take photos and short videos of the signs as they appear at home, since symptoms can disappear at the clinic because of stress. Don't forget photos of any previous test or X-ray results; you can send them to the smart consultant to have them explained before the visit.","Prepare your questions in advance: What is the likely cause? What are the options? How long will follow-up take? Which signs mean I should come back? Ask for medication instructions to be written clearly, including dose, timing and duration.","After the visit, finish the medication course even if your pet improves, note any side effects, and take regular photos to track progress. Set the follow-up date and write it down right away so it doesn't slip."]},"seasonal-care":{ar:["\u0641\u064A \u0627\u0644\u0635\u064A\u0641 \u0627\u062D\u0631\u0635 \u0639\u0644\u0649 \u062A\u0648\u0641\u0631 \u0627\u0644\u0645\u0627\u0621 \u0627\u0644\u0628\u0627\u0631\u062F \u0648\u0627\u0644\u0638\u0644\u060C \u0648\u062A\u062C\u0646\u0651\u0628 \u0627\u0644\u0646\u0632\u0647\u0627\u062A \u0641\u064A \u0630\u0631\u0648\u0629 \u0627\u0644\u062D\u0631\u0627\u0631\u0629\u060C \u0648\u0644\u0627 \u062A\u062A\u0631\u0643 \u062D\u064A\u0648\u0627\u0646\u0643 \u0623\u0628\u062F\u064B\u0627 \u062F\u0627\u062E\u0644 \u0633\u064A\u0627\u0631\u0629 \u0645\u063A\u0644\u0642\u0629. \u0627\u0644\u0623\u0631\u0635\u0641\u0629 \u0627\u0644\u0633\u0627\u062E\u0646\u0629 \u0642\u062F \u062A\u062D\u0631\u0642 \u0628\u0627\u0637\u0646 \u0627\u0644\u0643\u0641\u0648\u0641\u060C \u0648\u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0642\u0635\u064A\u0631\u0629 \u0627\u0644\u0623\u0646\u0641 \u0623\u0643\u062B\u0631 \u0639\u0631\u0636\u0629 \u0644\u0636\u0631\u0628\u0629 \u0627\u0644\u062D\u0631\u0627\u0631\u0629. \u0648\u0627\u0646\u062A\u0628\u0647 \u0644\u0644\u0628\u0631\u0627\u063A\u064A\u062B \u0627\u0644\u062A\u064A \u062A\u0646\u0634\u0637 \u0641\u064A \u0627\u0644\u062F\u0641\u0621.","\u0641\u064A \u0627\u0644\u0634\u062A\u0627\u0621 \u062A\u0648\u0641\u0651\u0631 \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0642\u0635\u064A\u0631\u0629 \u0627\u0644\u0634\u0639\u0631 \u0648\u0627\u0644\u0635\u063A\u064A\u0631\u0629 \u0648\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646 \u0645\u0643\u0627\u0646\u064B\u0627 \u062F\u0627\u0641\u0626\u064B\u0627 \u062C\u0627\u0641\u064B\u0627 \u0628\u0639\u064A\u062F\u064B\u0627 \u0639\u0646 \u0627\u0644\u062A\u064A\u0627\u0631\u0627\u062A \u0627\u0644\u0647\u0648\u0627\u0626\u064A\u0629\u060C \u0648\u0642\u062F \u064A\u0644\u0632\u0645\u0647\u0627 \u0645\u0644\u0627\u0628\u0633 \u0645\u0646\u0627\u0633\u0628\u0629 \u0641\u064A \u0627\u0644\u062E\u0627\u0631\u062C. \u062C\u0641\u0651\u0641 \u0627\u0644\u0643\u0641\u0648\u0641 \u0628\u0639\u062F \u0627\u0644\u0645\u0634\u064A \u0644\u0625\u0632\u0627\u0644\u0629 \u0627\u0644\u0645\u0644\u062D \u0648\u0627\u0644\u0645\u0648\u0627\u062F \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645\u0629 \u0641\u064A \u0627\u0644\u0637\u0631\u0642\u060C \u0648\u0631\u0627\u0642\u0628 \u0643\u064A\u0641 \u064A\u062A\u062D\u0645\u0651\u0644 \u062D\u064A\u0648\u0627\u0646\u0643 \u0627\u0644\u062A\u062F\u0641\u0626\u0629 \u0648\u0627\u0644\u0647\u0648\u0627\u0621 \u0627\u0644\u062C\u0627\u0641.","\u0627\u0644\u0631\u0637\u0648\u0628\u0629 \u0648\u0627\u0644\u0623\u0645\u0637\u0627\u0631 \u062A\u0633\u0647\u0651\u0644 \u0646\u0645\u0648 \u0627\u0644\u062C\u0631\u0627\u062B\u064A\u0645 \u0648\u0627\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A. \u062C\u0641\u0651\u0641 \u062D\u064A\u0648\u0627\u0646\u0643 \u062C\u064A\u062F\u064B\u0627 \u0628\u0639\u062F \u0627\u0644\u0628\u0644\u0644\u060C \u0648\u0646\u0638\u0651\u0641 \u0627\u0644\u0641\u0631\u0627\u0634 \u0648\u062C\u0641\u0651\u0641\u0647\u060C \u0648\u0627\u0647\u062A\u0645 \u0628\u062A\u0647\u0648\u064A\u0629 \u0623\u0645\u0627\u0643\u0646 \u0646\u0648\u0645\u0647.","\u064A\u062A\u0633\u0627\u0642\u0637 \u0627\u0644\u0634\u0639\u0631 \u0628\u0643\u062B\u0627\u0641\u0629 \u0623\u0643\u0628\u0631 \u0641\u064A \u0627\u0644\u0631\u0628\u064A\u0639 \u0648\u0627\u0644\u062E\u0631\u064A\u0641 \u0645\u0639 \u062A\u0628\u062F\u0651\u0644 \u0627\u0644\u0641\u0635\u0648\u0644. \u0632\u0650\u062F \u0639\u062F\u062F \u062C\u0644\u0633\u0627\u062A \u0627\u0644\u062A\u0645\u0634\u064A\u0637 \u0641\u064A \u0647\u0630\u0647 \u0627\u0644\u0641\u062A\u0631\u0629\u060C \u0648\u0627\u062D\u0631\u0635 \u0639\u0644\u0649 \u063A\u0630\u0627\u0621 \u062C\u064A\u062F \u0648\u0645\u0627\u0621 \u0646\u0638\u064A\u0641\u060C \u0648\u0631\u0627\u0642\u0628 \u0623\u064A \u062A\u063A\u064A\u0651\u0631 \u0641\u064A \u0646\u0634\u0627\u0637 \u062D\u064A\u0648\u0627\u0646\u0643 \u0623\u0648 \u0634\u0647\u064A\u062A\u0647 \u0645\u0639 \u062A\u063A\u064A\u0651\u0631 \u0627\u0644\u0637\u0642\u0633."],en:["In summer, keep cool water and shade available, avoid walks at peak heat, and never leave your pet in a closed car. Hot pavement can burn paw pads, and short-nosed breeds are more prone to heatstroke. Watch for fleas, which thrive in warmth.","In winter, give short-haired, small and senior pets a warm, dry spot away from draughts, and suitable clothing outdoors if needed. Dry paws after walks to remove salt and road chemicals, and watch how your pet copes with heating and dry air.","Humidity and rain make it easier for germs and parasites to thrive. Dry your pet well after getting wet, clean and dry the bedding, and keep their sleeping area ventilated.","Pets shed more heavily in spring and autumn as the seasons turn. Brush more often during this period, keep up good food and fresh water, and watch for changes in energy or appetite as the weather changes."]},"recognising-emergencies":{ar:["\u062A\u0633\u062A\u062F\u0639\u064A \u0627\u0644\u0645\u0633\u0627\u0639\u062F\u0629 \u0627\u0644\u0641\u0648\u0631\u064A\u0629: \u0635\u0639\u0648\u0628\u0629 \u0627\u0644\u062A\u0646\u0641\u0633 \u0623\u0648 \u0627\u0644\u0644\u0647\u0627\u062B \u0627\u0644\u0634\u062F\u064A\u062F\u060C \u0648\u0644\u062B\u0629 \u0634\u0627\u062D\u0628\u0629 \u0623\u0648 \u0632\u0631\u0642\u0627\u0621\u060C \u0648\u0627\u0644\u0646\u0632\u064A\u0641 \u0627\u0644\u0630\u064A \u0644\u0627 \u064A\u062A\u0648\u0642\u0641\u060C \u0648\u0627\u0644\u062A\u0634\u0646\u062C\u0627\u062A\u060C \u0648\u0627\u0644\u0627\u0646\u0647\u064A\u0627\u0631 \u0623\u0648 \u0641\u0642\u062F\u0627\u0646 \u0627\u0644\u0648\u0639\u064A\u060C \u0648\u0627\u0646\u062A\u0641\u0627\u062E \u0627\u0644\u0628\u0637\u0646 \u0645\u0639 \u0645\u062D\u0627\u0648\u0644\u0627\u062A \u0642\u064A\u0621 \u0628\u0644\u0627 \u0646\u062A\u064A\u062C\u0629\u060C \u0648\u062A\u0646\u0627\u0648\u0644 \u0633\u0645 \u0623\u0648 \u0645\u0627\u062F\u0629 \u062E\u0637\u0631\u0629\u060C \u0648\u0627\u0644\u0625\u0635\u0627\u0628\u0627\u062A \u0627\u0644\u0634\u062F\u064A\u062F\u0629 \u0623\u0648 \u0627\u0644\u062D\u0648\u0627\u062F\u062B\u060C \u0648\u0639\u062F\u0645 \u0627\u0644\u0642\u062F\u0631\u0629 \u0639\u0644\u0649 \u0627\u0644\u062A\u0628\u0648\u0644.","\u062D\u0627\u0641\u0638 \u0639\u0644\u0649 \u0647\u062F\u0648\u0626\u0643\u060C \u0648\u0623\u0628\u0639\u062F \u062D\u064A\u0648\u0627\u0646\u0643 \u0639\u0646 \u0645\u0635\u062F\u0631 \u0627\u0644\u062E\u0637\u0631\u060C \u0648\u062A\u062D\u062F\u062B \u0625\u0644\u064A\u0647 \u0628\u0635\u0648\u062A \u0645\u0646\u062E\u0641\u0636. \u0625\u0646 \u0643\u0627\u0646 \u0647\u0646\u0627\u0643 \u0646\u0632\u064A\u0641 \u0641\u0627\u0636\u063A\u0637 \u0639\u0644\u064A\u0647 \u0628\u0642\u0637\u0639\u0629 \u0642\u0645\u0627\u0634 \u0646\u0638\u064A\u0641\u0629. \u0644\u0627 \u062A\u0639\u0637\u0650 \u0623\u064A \u062F\u0648\u0627\u0621 \u0628\u0634\u0631\u064A \u0648\u0644\u0627 \u062A\u062D\u0627\u0648\u0644 \u0625\u062C\u0628\u0627\u0631 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0639\u0644\u0649 \u0627\u0644\u062A\u0642\u064A\u0624 \u062F\u0648\u0646 \u0625\u0631\u0634\u0627\u062F \u0645\u062E\u062A\u0635. \u062A\u0630\u0643\u0651\u0631 \u0623\u0646 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0627\u0644\u0645\u062A\u0623\u0644\u0645 \u0642\u062F \u064A\u0639\u0636\u0651 \u0623\u0648 \u064A\u062E\u062F\u0634 \u062D\u062A\u0649 \u0645\u0639 \u0645\u0646 \u064A\u062D\u0628\u0647.","\u0627\u062D\u062A\u0641\u0638 \u0628\u0631\u0642\u0645 \u0639\u064A\u0627\u062F\u0629 \u0642\u0631\u064A\u0628\u0629 \u0648\u0645\u0633\u062A\u0634\u0641\u0649 \u0637\u0648\u0627\u0631\u0626 \u064A\u0639\u0645\u0644 \u0639\u0644\u0649 \u0645\u062F\u0627\u0631 \u0627\u0644\u0633\u0627\u0639\u0629 \u0641\u064A \u0647\u0627\u062A\u0641\u0643 \u0648\u0639\u0644\u0649 \u0628\u0627\u0628 \u0627\u0644\u062B\u0644\u0627\u062C\u0629\u060C \u0648\u0628\u0631\u0642\u0645 \u062E\u0637 \u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0627\u0644\u0633\u0645\u0648\u0645 \u0625\u0646 \u062A\u0648\u0641\u0631 \u0641\u064A \u0628\u0644\u062F\u0643. \u0648\u062C\u0647\u0651\u0632 \u0645\u0644\u0641\u064B\u0627 \u0628\u0627\u0644\u062A\u0637\u0639\u064A\u0645\u0627\u062A \u0648\u0627\u0644\u0623\u062F\u0648\u064A\u0629 \u0627\u0644\u062D\u0627\u0644\u064A\u0629 \u0648\u0627\u0644\u062D\u0633\u0627\u0633\u064A\u0629 \u0627\u0644\u0645\u0639\u0631\u0648\u0641\u0629.","\u0627\u0646\u0642\u0644 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0627\u0644\u0635\u063A\u064A\u0631 \u062F\u0627\u062E\u0644 \u0646\u0627\u0642\u0644 \u0645\u0628\u0637\u0651\u0646 \u0623\u0648 \u0635\u0646\u062F\u0648\u0642 \u0645\u062A\u064A\u0646\u060C \u0648\u0627\u0646\u0642\u0644 \u0627\u0644\u062D\u064A\u0648\u0627\u0646 \u0627\u0644\u0643\u0628\u064A\u0631 \u0639\u0644\u0649 \u0644\u0648\u062D \u0623\u0648 \u0628\u0637\u0627\u0646\u064A\u0629 \u0645\u0634\u062F\u0648\u062F\u0629 \u0628\u064A\u0646 \u0634\u062E\u0635\u064A\u0646 \u0645\u0639 \u062A\u062B\u0628\u064A\u062A \u0627\u0644\u0631\u0642\u0628\u0629 \u0648\u0627\u0644\u0638\u0647\u0631 \u0642\u062F\u0631 \u0627\u0644\u0625\u0645\u0643\u0627\u0646 \u0625\u0630\u0627 \u0627\u0634\u062A\u0628\u0647\u062A \u0628\u0625\u0635\u0627\u0628\u0629. \u0627\u062A\u0635\u0644 \u0628\u0627\u0644\u0639\u064A\u0627\u062F\u0629 \u0642\u0628\u0644 \u0627\u0644\u0648\u0635\u0648\u0644 \u0644\u062A\u062C\u0647\u0651\u0632 \u0646\u0641\u0633\u0647\u0627."],en:["Immediate help is needed for trouble breathing or heavy panting, pale or blue gums, bleeding that won't stop, seizures, collapse or loss of consciousness, a swollen belly with unproductive retching, swallowing a poison or hazardous item, severe injuries or accidents, and being unable to urinate.","Stay calm, move your pet away from the source of danger and speak softly. For bleeding, press on it with a clean cloth. Don't give human medication or try to make your pet vomit without expert guidance. Remember that an animal in pain may bite or scratch even someone they love.","Keep the number of a nearby clinic and a 24-hour emergency hospital in your phone and on the fridge, plus a poison helpline if one exists in your country. Prepare a file with vaccinations, current medications and known allergies.","Move a small animal in a padded carrier or sturdy box, and a large one on a board or a blanket held taut between two people, supporting the neck and back as much as possible if you suspect an injury. Call the clinic before arriving so they can prepare."]},"cat-care-guide":{ar:["\u062A\u062D\u062A\u0627\u062C \u0627\u0644\u0642\u0637\u0629 \u0625\u0644\u0649 \u0645\u0643\u0627\u0646 \u0622\u0645\u0646 \u0648\u062F\u0627\u0641\u0626 \u0644\u0644\u0646\u0648\u0645\u060C \u0648\u0635\u0646\u062F\u0648\u0642 \u0631\u0645\u0644 \u0646\u0638\u064A\u0641 \u0641\u064A \u0645\u0643\u0627\u0646 \u0647\u0627\u062F\u0626 (\u0648\u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0627\u0644\u0645\u0641\u064A\u062F\u0629 \u0635\u0646\u062F\u0648\u0642 \u0644\u0643\u0644 \u0642\u0637\u0629 \u0632\u0627\u0626\u062F \u0648\u0627\u062D\u062F)\u060C \u0648\u0645\u0643\u0627\u0646 \u0645\u0631\u062A\u0641\u0639 \u0644\u0644\u062A\u0633\u0644\u0642 \u0648\u0627\u0644\u0645\u0631\u0627\u0642\u0628\u0629\u060C \u0648\u0623\u0645\u0627\u0643\u0646 \u0644\u0644\u0627\u062E\u062A\u0628\u0627\u0621. \u0648\u0623\u0628\u0639\u062F \u0635\u0646\u062F\u0648\u0642 \u0627\u0644\u0631\u0645\u0644 \u0639\u0646 \u0645\u0643\u0627\u0646 \u0627\u0644\u0623\u0643\u0644 \u0648\u0627\u0644\u0634\u0631\u0628.","\u062A\u0646\u0638\u0651\u0641 \u0627\u0644\u0642\u0637\u0637 \u0646\u0641\u0633\u0647\u0627 \u0628\u0646\u0641\u0633\u0647\u0627\u060C \u0644\u0643\u0646 \u0627\u0644\u062A\u0645\u0634\u064A\u0637 \u064A\u0633\u0627\u0639\u062F\u0647\u0627 \u062E\u0627\u0635\u0629 \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0637\u0648\u064A\u0644\u0629 \u0627\u0644\u0634\u0639\u0631 \u0648\u064A\u0642\u0644\u0644 \u0643\u0631\u0627\u062A \u0627\u0644\u0634\u0639\u0631. \u0642\u0635\u0651 \u0627\u0644\u0645\u062E\u0627\u0644\u0628 \u0639\u0646\u062F \u0627\u0644\u062D\u0627\u062C\u0629\u060C \u0648\u0648\u0641\u0651\u0631 \u0644\u0647\u0627 \u0644\u0648\u062D \u062E\u062F\u0634 \u0644\u062A\u0635\u0631\u064A\u0641 \u063A\u0631\u064A\u0632\u062A\u0647\u0627 \u0628\u062F\u0644 \u0627\u0644\u0623\u062B\u0627\u062B. \u0648\u0627\u0644\u0646\u0638\u0627\u0641\u0629 \u0627\u0644\u0630\u0627\u062A\u064A\u0629 \u0627\u0644\u0645\u0641\u0631\u0637\u0629 \u0642\u062F \u062A\u0643\u0648\u0646 \u0639\u0644\u0627\u0645\u0629 \u062A\u0648\u062A\u0631 \u0623\u0648 \u062D\u0633\u0627\u0633\u064A\u0629.","\u0627\u0644\u0644\u0639\u0628 \u062C\u0632\u0621 \u0645\u0646 \u0635\u062D\u062A\u0647\u0627 \u0627\u0644\u0646\u0641\u0633\u064A\u0629 \u0648\u0627\u0644\u062C\u0633\u062F\u064A\u0629: \u0644\u0639\u0628 \u0627\u0644\u0635\u064A\u062F \u0628\u0627\u0644\u0635\u0646\u0627\u0631\u0629 \u0648\u0627\u0644\u0631\u064A\u0634\u060C \u0648\u0623\u0644\u0639\u0627\u0628 \u0627\u0644\u0623\u0644\u063A\u0627\u0632 \u0644\u062A\u0642\u062F\u064A\u0645 \u0627\u0644\u0637\u0639\u0627\u0645\u060C \u0648\u062A\u0646\u0648\u064A\u0639 \u0627\u0644\u0623\u0644\u0639\u0627\u0628 \u0628\u064A\u0646 \u0641\u062A\u0631\u0629 \u0648\u0623\u062E\u0631\u0649. \u062C\u0644\u0633\u0627\u062A \u0642\u0635\u064A\u0631\u0629 \u0645\u062A\u0643\u0631\u0631\u0629 \u0623\u0641\u0636\u0644 \u0645\u0646 \u062C\u0644\u0633\u0629 \u0648\u0627\u062D\u062F\u0629 \u0637\u0648\u064A\u0644\u0629.","\u062A\u064F\u062E\u0641\u064A \u0627\u0644\u0642\u0637\u0637 \u0627\u0644\u0623\u0644\u0645 \u0648\u0627\u0644\u0645\u0631\u0636 \u0628\u0645\u0647\u0627\u0631\u0629\u060C \u0641\u0627\u0646\u062A\u0628\u0647 \u0625\u0644\u0649 \u0627\u0644\u062A\u063A\u064A\u0651\u0631\u0627\u062A \u0627\u0644\u0637\u0641\u064A\u0641\u0629 \u0641\u064A \u0627\u0644\u0623\u0643\u0644 \u0648\u0627\u0644\u0634\u0631\u0628 \u0648\u0627\u0644\u0646\u0648\u0645 \u0648\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0635\u0646\u062F\u0648\u0642 \u0627\u0644\u0631\u0645\u0644. \u0648\u0627\u0644\u0641\u062D\u0648\u0635 \u0627\u0644\u062F\u0648\u0631\u064A\u0629 \u0648\u0627\u0644\u062A\u0637\u0639\u064A\u0645\u0627\u062A \u0648\u0645\u0636\u0627\u062F\u0627\u062A \u0627\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A \u0645\u0647\u0645\u0629 \u062D\u062A\u0649 \u0644\u0644\u0642\u0637\u0637 \u0627\u0644\u062A\u064A \u0644\u0627 \u062A\u063A\u0627\u062F\u0631 \u0627\u0644\u0645\u0646\u0632\u0644."],en:["A cat needs a safe, warm place to sleep, a clean litter box in a quiet spot (a helpful rule is one box per cat plus one), a high perch for climbing and watching, and places to hide. Keep the litter box away from food and water.","Cats groom themselves, but brushing helps, especially long-haired ones, and reduces hairballs. Trim claws when needed and provide a scratching post so the instinct goes there rather than to furniture. Excessive self-grooming can be a sign of stress or allergy.","Play is part of her mental and physical health: wand-and-feather hunting games, puzzle feeders, and rotating toys every so often. Short, frequent sessions beat one long one.","Cats hide pain and illness skilfully, so notice small changes in eating, drinking, sleeping and litter box use. Regular check-ups, vaccinations and parasite control matter even for cats that never leave the house."]},"dog-care-guide":{ar:["\u062A\u062E\u062A\u0644\u0641 \u062D\u0627\u062C\u0629 \u0627\u0644\u0643\u0644\u0627\u0628 \u0625\u0644\u0649 \u0627\u0644\u062D\u0631\u0643\u0629 \u0628\u062D\u0633\u0628 \u0627\u0644\u0633\u0644\u0627\u0644\u0629 \u0648\u0627\u0644\u0639\u0645\u0631\u060C \u0644\u0643\u0646 \u0645\u0639\u0638\u0645\u0647\u0627 \u064A\u062D\u062A\u0627\u062C \u0625\u0644\u0649 \u0646\u0632\u0647\u0629 \u0623\u0648 \u0627\u062B\u0646\u062A\u064A\u0646 \u064A\u0648\u0645\u064A\u064B\u0627 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644 \u0645\u0639 \u0648\u0642\u062A \u0644\u0644\u062C\u0631\u064A \u0648\u0627\u0644\u0644\u0639\u0628. \u0627\u0644\u0643\u0644\u0627\u0628 \u0627\u0644\u0646\u0634\u064A\u0637\u0629 \u0645\u062B\u0644 \u0627\u0644\u0631\u0627\u0639\u064A \u0648\u0627\u0644\u0631\u064A\u062A\u0631\u064A\u0641\u0631 \u062A\u062D\u062A\u0627\u062C \u0623\u0643\u062B\u0631. \u0648\u0627\u0644\u0645\u0644\u0644 \u0627\u0644\u0645\u0632\u0645\u0646 \u064A\u0638\u0647\u0631 \u063A\u0627\u0644\u0628\u064B\u0627 \u0641\u064A \u0635\u0648\u0631\u0629 \u0646\u0628\u0627\u062D \u0623\u0648 \u062A\u062E\u0631\u064A\u0628.","\u0627\u0628\u062F\u0623 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0645\u0628\u0643\u0631\u064B\u0627 \u0628\u0627\u0644\u0645\u0643\u0627\u0641\u0622\u062A \u0627\u0644\u0625\u064A\u062C\u0627\u0628\u064A\u0629 \u0648\u0627\u0644\u062B\u0646\u0627\u0621\u060C \u0648\u0627\u0633\u062A\u062E\u062F\u0645 \u0623\u0648\u0627\u0645\u0631 \u0642\u0635\u064A\u0631\u0629 \u062B\u0627\u0628\u062A\u0629 \u0645\u062B\u0644 \u0627\u062C\u0644\u0633 \u0648\u062A\u0639\u0627\u0644. \u0648\u0627\u0644\u062A\u0639\u0631\u064A\u0641 \u0628\u0627\u0644\u0646\u0627\u0633 \u0648\u0627\u0644\u0623\u0635\u0648\u0627\u062A \u0648\u0627\u0644\u0623\u0645\u0627\u0643\u0646 \u0648\u0627\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A \u0627\u0644\u0623\u062E\u0631\u0649 \u0641\u064A \u0639\u0645\u0631 \u0635\u063A\u064A\u0631 \u064A\u062C\u0639\u0644 \u0627\u0644\u0643\u0644\u0628 \u0623\u0643\u062B\u0631 \u0647\u062F\u0648\u0621\u064B\u0627 \u0648\u062B\u0642\u0629 \u0639\u0646\u062F\u0645\u0627 \u064A\u0643\u0628\u0631.","\u0645\u0634\u0651\u0637 \u0627\u0644\u0641\u0631\u0648 \u0628\u062D\u0633\u0628 \u0646\u0648\u0639\u0647\u060C \u0648\u0627\u0641\u062D\u0635 \u0627\u0644\u0623\u0630\u0646\u064A\u0646 \u0628\u062D\u062B\u064B\u0627 \u0639\u0646 \u0627\u0644\u0627\u062D\u0645\u0631\u0627\u0631 \u0623\u0648 \u0627\u0644\u0631\u0627\u0626\u062D\u0629\u060C \u0648\u0642\u0635\u0651 \u0627\u0644\u0645\u062E\u0627\u0644\u0628 \u0625\u0630\u0627 \u0644\u0645 \u062A\u062A\u0622\u0643\u0644 \u0628\u0627\u0644\u0645\u0634\u064A. \u0646\u0638\u0651\u0641 \u0627\u0644\u0623\u0633\u0646\u0627\u0646 \u0628\u0641\u0631\u0634\u0627\u0629 \u0645\u062E\u0635\u0635\u0629 \u0644\u0644\u0643\u0644\u0627\u0628 \u0623\u0648 \u0628\u0645\u0636\u063A \u062E\u0627\u0635 \u0628\u0630\u0644\u0643\u060C \u0648\u062C\u0641\u0651\u0641 \u0627\u0644\u0643\u0641\u0648\u0641 \u0628\u0639\u062F \u0627\u0644\u0645\u0634\u064A \u0641\u064A \u0627\u0644\u0623\u062C\u0648\u0627\u0621 \u0627\u0644\u0631\u0637\u0628\u0629.","\u0627\u0647\u062A\u0645 \u0628\u0627\u0644\u062A\u0637\u0639\u064A\u0645\u0627\u062A \u0627\u0644\u062F\u0648\u0631\u064A\u0629 function mkBtn(float){var b=document.createElement("button");b.type="button";b.className="al-dl"+(float?" al-dl-float":"");b.setAttribute("data-al-dl","1");b.setAttribute("aria-label",ar()?"تحميل PetCare":"Download PetCare");b.innerHTML=ICON+"<span>"+(ar()?"تحميل PetCare":"Download PetCare")+"</span>";b.onclick=go;return b}
function place(){
  if(installed()){document.querySelectorAll("[data-al-dl]").forEach(function(x){x.remove()});return}
  var hdr=document.querySelector("header nav");
  var existing=document.querySelector("[data-al-dl]:not(.al-dl-float)");
  if(hdr){
    var fl=document.querySelector(".al-dl-float");if(fl)fl.remove();
    if(!existing||!hdr.contains(existing)){
      if(existing)existing.remove();
      var grp=hdr.querySelector("div.flex.items-center")||hdr.lastElementChild;
      var b=mkBtn(false);
      if(grp&&grp.parentNode)grp.parentNode.insertBefore(b,grp);else hdr.appendChild(b);
    }
  }else if(!document.querySelector("[data-al-dl]")){document.body.appendChild(mkBtn(true))}
  // keep label language in sync
  document.querySelectorAll("[data-al-dl]").forEach(function(x){var t=ar()?"تحميل PetCare":"Download PetCare";var sp=x.querySelector("span");if(sp&&sp.textContent!==t){sp.textContent=t;x.setAttribute("aria-label",t)}});
}
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e});
addEventListener("appinstalled",function(){place()});
var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(place,80)}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["lang"]});
if(document.readyState!=="loading")place();else addEventListener("DOMContentLoaded",place);
})();
</script></body></html>
